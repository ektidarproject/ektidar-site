<style>
:root{
  --bg:#eef6f8; --card:#ffffff; --text:#0b3a63; --muted:#55708a; --accent:#13b1a1; --border:#d3e6ea; --btn:#005ea6; --btn-text:#ffffff;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#061b30;--card:#0c2a47;--text:#eaf4f8;--muted:#9bb6c9;--accent:#2fd0bf;--border:#17405f;--btn:#13b1a1;--btn-text:#04202e;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#061b30;--card:#0c2a47;--text:#eaf4f8;--muted:#9bb6c9;--accent:#2fd0bf;--border:#17405f;--btn:#13b1a1;--btn-text:#04202e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:32px 18px}
main{width:100%;max-width:460px;text-align:center}
.logo{width:150px;margin:0 auto 18px;padding:14px;background:#ffffff;border:2px solid var(--accent);border-radius:26px;box-shadow:0 8px 24px rgba(0,94,166,.15)}
.logo-svg{display:block;width:100%;height:auto}
h1{margin:0 0 4px;font-size:28px}
.en{margin:0 0 14px;color:var(--accent);font-weight:500;letter-spacing:.5px;direction:ltr}
.bio{margin:0 auto 26px;color:var(--muted);line-height:1.8;font-size:16px;max-width:360px}
.links{display:flex;flex-direction:column;gap:12px}
.link{display:flex;align-items:center;gap:14px;padding:15px 18px;background:var(--card);border:1px solid var(--border);border-radius:16px;color:var(--text);text-decoration:none;font-weight:700;font-size:17px;transition:transform .15s,box-shadow .15s,border-color .15s}
.link:hover,.link:focus-visible{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 6px 18px rgba(0,0,0,.12);outline:none}
.ico{width:42px;height:42px;border-radius:12px;background:var(--btn);color:var(--btn-text);display:grid;place-items:center;flex:none}
.ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.label{flex:1;text-align:start}
.sub{display:block;font-weight:400;font-size:13px;color:var(--muted);direction:ltr;text-align:start}
.arrow{color:var(--accent);font-size:20px}
.gallery{margin-top:28px;display:none}
.gallery.has{display:block}
.gallery h2{font-size:18px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;border:1px solid var(--border)}
footer{margin-top:30px;font-size:13px;color:var(--muted)}
</style>

    {type:"telegram", title:"تيليغرام", sub:"t.me/ektidarproject", url:"https://t.me/ektidarproject"}
  ],
  footer: "© جمعية اقتدار"
};

const ICONS = {
  whatsapp:'<path d="M3 21l1.6-4.6A8.5 8.5 0 1 1 8 19.6L3 21z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-.8.8c-.8-.4-1.5-1.1-1.9-1.9l.8-.8-1-2L9 9.5z"/>',
  instagram:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".8"/>',
  facebook:'<path d="M14 8h3V4h-3a4 4 0 0 0-4 4v2H7v4h3v7h4v-7h3l1-4h-4V8z"/>',
  youtube:'<rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10 9.5v5l4.5-2.5-4.5-2.5z"/>',
  telegram:'<path d="M21 4L3 11l6 2 2 6 3-4 5 4L21 4z"/><path d="M9 13l12-9"/>'
};
document.getElementById('name').textContent = CONFIG.name;
document.getElementById('en').textContent = CONFIG.english;
document.getElementById('bio').textContent = CONFIG.bio;
document.getElementById('foot').textContent = CONFIG.footer;
const nav = document.getElementById('links');
CONFIG.links.forEach(k => {
  const a = document.createElement('a');
  a.className='link'; a.href=k.url; a.target='_blank'; a.rel='noopener noreferrer';
  a.innerHTML = '<span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[k.type]+'</svg></span><span class="label"></span><span class="arrow">‹</span>';
  const lb = a.querySelector('.label');
  lb.textContent = k.title;
  if (k.sub) { const s=document.createElement('span'); s.className='sub'; s.textContent=k.sub; lb.appendChild(s); }
  nav.appendChild(a);
});
if (CONFIG.photos.length) {
  document.getElementById('gallery').classList.add('has');
  const g = document.getElementById('grid');
  CONFIG.photos.forEach(p => { const i=document.createElement('img'); i.src=p; i.alt='ورشة'; i.loading='lazy'; g.appendChild(i); });
}
</script>
